services:
  yt-dlp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: heymedia-yt-dlp-server
    restart: unless-stopped
    init: true
    # Khớp uid/gid host để ghi được vào bind mount ./downloads. Docker tạo thư
    # mục bind mount bằng root nếu nó chưa tồn tại, nên phải mkdir trước khi up.
    user: "${RUN_UID:-1000}:${RUN_GID:-1000}"
    depends_on:
      - bgutil-provider
    environment:
      NODE_ENV: production
      # Cố định: đây là port bên trong container, không đổi theo host.
      PORT: 3001
      HOST: 0.0.0.0
      DOWNLOAD_DIR: /downloads
      MAX_ACTIVE_JOBS: ${MAX_ACTIVE_JOBS:-3}
      JOB_TIMEOUT_MS: ${JOB_TIMEOUT_MS:-600000}
      JOB_TTL_MS: ${JOB_TTL_MS:-3600000}
      YTDLP_HOME: /opt/ytdlp
      YTDLP_BIN: /opt/ytdlp/bin/yt-dlp
      YTDLP_JS_RUNTIME: /opt/ytdlp/bin/deno
      FFMPEG_BIN: /usr/bin/ffmpeg
      DENO_DIR: /tmp/deno
      # Tự cập nhật yt-dlp mỗi lần container khởi động (đặt 0 để khoá phiên bản).
      YTDLP_AUTO_UPDATE: ${YTDLP_AUTO_UPDATE:-1}
      YTDLP_COOKIES_FILE: ${YTDLP_COOKIES_FILE:-}
      YTDLP_IMPERSONATE_CLIENT: ${YTDLP_IMPERSONATE_CLIENT:-}
      DOUYIN_BROWSER_FALLBACK: ${DOUYIN_BROWSER_FALLBACK:-0}
      # Client mặc định của yt-dlp (android_vr) bị YouTube trả 403 giữa chừng.
      YOUTUBE_PLAYER_CLIENT: ${YOUTUBE_PLAYER_CLIENT:-web_embedded,mweb}
      # Thử lần lượt từng client khi client trước 403 hoặc không còn format.
      YOUTUBE_CLIENT_CHAIN: ${YOUTUBE_CLIENT_CHAIN:-web_embedded,mweb,web_safari,android}
      YOUTUBE_FALLBACK_PLAYER_CLIENT: ${YOUTUBE_FALLBACK_PLAYER_CLIENT:-}
      YOUTUBE_PO_TOKEN: ${YOUTUBE_PO_TOKEN:-}
      # Provider tự sinh PO token, thay cho việc dán tay YOUTUBE_PO_TOKEN.
      YOUTUBE_POT_BASE_URL: ${YOUTUBE_POT_BASE_URL:-http://bgutil-provider:4416}
    ports:
      # BIND_ADDR: đổi thành 0.0.0.0 nếu cần client LAN gọi trực tiếp.
      - "${BIND_ADDR:-127.0.0.1}:${HOST_PORT:-3001}:3001"
    volumes:
      - ./downloads:/downloads
      - ./cookies:/cookies:ro
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Sinh PO token cho YouTube. Không có nó, nhiều format bị YouTube chặn.
  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    container_name: heymedia-bgutil-provider
    restart: unless-stopped
    init: true
    expose:
      - "4416"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
